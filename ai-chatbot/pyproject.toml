[project]
name = "ai-chatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "suresh", email = "suresh.kandregula@accenture.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.163.1",
    "langchain>=1.5.0",
    "langchain-chroma>=1.1.0",
    "langchain-google-genai>=4.5.0",
    "langchain-text-splitters>=1.1.3",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
ai-chatbot = "ai_chatbot:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
